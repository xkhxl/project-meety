AWSTemplateFormatVersion: '2010-09-09'
Description: Project Meety - Production-style serverless meeting scheduler

Parameters:
  ProjectName:
    Type: String
    Default: project-meety

  EnvironmentName:
    Type: String
    Default: dev

  InitialUsername:
    Type: String
    Description: Initial Cognito username

  InitialUserEmail:
    Type: String
    Description: Initial Cognito user email

  LambdaArtifactBucket:
    Type: String
    Description: S3 bucket containing packaged Lambda zip artifacts

  LexBotId:
    Type: String
    Description: Amazon Lex bot ID

  LexBotAliasId:
    Type: String
    Description: Amazon Lex bot alias ID
    Default: TSTALIASID

Resources:
  MeetingsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub '${ProjectName}-${EnvironmentName}-meetings'
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: meetingId
          AttributeType: S
        - AttributeName: status
          AttributeType: S
        - AttributeName: date
          AttributeType: S
      KeySchema:
        - AttributeName: meetingId
          KeyType: HASH
      GlobalSecondaryIndexes:
        - IndexName: StatusIndex
          KeySchema:
            - AttributeName: status
              KeyType: HASH
            - AttributeName: date
              KeyType: RANGE
          Projection:
            ProjectionType: ALL

  FrontendBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub '${ProjectName}-${EnvironmentName}-frontend-${AWS::AccountId}'
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true

  CloudFrontOriginAccessIdentity:
    Type: AWS::CloudFront::CloudFrontOriginAccessIdentity
    Properties:
      CloudFrontOriginAccessIdentityConfig:
        Comment: !Sub 'OAI for ${ProjectName}-${EnvironmentName}'

  FrontendBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref FrontendBucket
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Sid: AllowCloudFrontRead
            Effect: Allow
            Principal:
              AWS: !Sub 'arn:aws:iam::cloudfront:user/CloudFront Origin Access Identity ${CloudFrontOriginAccessIdentity.Id}'
            Action: 's3:GetObject'
            Resource: !Sub '${FrontendBucket.Arn}/*'

  FrontendDistribution:
    Type: AWS::CloudFront::Distribution
    Properties:
      DistributionConfig:
        Enabled: true
        DefaultRootObject: index.html
        HttpVersion: http2
        IPV6Enabled: true
        PriceClass: PriceClass_100
        Origins:
          - Id: frontend-s3-origin
            DomainName: !GetAtt FrontendBucket.RegionalDomainName
            S3OriginConfig:
              OriginAccessIdentity: !Sub 'origin-access-identity/cloudfront/${CloudFrontOriginAccessIdentity.Id}'
        DefaultCacheBehavior:
          TargetOriginId: frontend-s3-origin
          ViewerProtocolPolicy: redirect-to-https
          ForwardedValues:
            QueryString: false
        CustomErrorResponses:
          - ErrorCode: 403
            ResponseCode: 200
            ResponsePagePath: /index.html
            ErrorCachingMinTTL: 0
          - ErrorCode: 404
            ResponseCode: 200
            ResponsePagePath: /index.html
            ErrorCachingMinTTL: 0
        ViewerCertificate:
          CloudFrontDefaultCertificate: true
  CognitoUserPool:
    Type: AWS::Cognito::UserPool
    Properties:
      UserPoolName: !Sub '${ProjectName}-${EnvironmentName}-userpool'
      AutoVerifiedAttributes:
        - email
      Policies:
        PasswordPolicy:
          MinimumLength: 8
          RequireLowercase: true
          RequireNumbers: true
          RequireSymbols: false
          RequireUppercase: true
      MfaConfiguration: 'OFF'
      AdminCreateUserConfig:
        AllowAdminCreateUserOnly: true
      Schema:
        - Name: email
          Required: true
          Mutable: true

  CognitoUserPoolClient:
    Type: AWS::Cognito::UserPoolClient
    Properties:
      ClientName: !Sub '${ProjectName}-${EnvironmentName}-client'
      GenerateSecret: false
      UserPoolId: !Ref CognitoUserPool

  CognitoInitialUser:
    Type: AWS::Cognito::UserPoolUser
    Properties:
      UserPoolId: !Ref CognitoUserPool
      Username: !Ref InitialUsername
      DesiredDeliveryMediums:
        - EMAIL
      UserAttributes:
        - Name: email
          Value: !Ref InitialUserEmail

  HttpApi:
    Type: AWS::ApiGatewayV2::Api
    Properties:
      Name: !Sub '${ProjectName}-${EnvironmentName}-api'
      ProtocolType: HTTP
      CorsConfiguration:
        AllowOrigins:
          - '*'
        AllowMethods:
          - GET
          - POST
          - PUT
          - OPTIONS
        AllowHeaders:
          - '*'

  HttpApiStage:
    Type: AWS::ApiGatewayV2::Stage
    Properties:
      ApiId: !Ref HttpApi
      StageName: v1
      AutoDeploy: true

  JwtAuthorizer:
    Type: AWS::ApiGatewayV2::Authorizer
    Properties:
      ApiId: !Ref HttpApi
      Name: CognitoJwtAuthorizer
      AuthorizerType: JWT
      IdentitySource:
        - '$request.header.Authorization'
      JwtConfiguration:
        Audience:
          - !Ref CognitoUserPoolClient
        Issuer: !Sub 'https://cognito-idp.${AWS::Region}.amazonaws.com/${CognitoUserPool}'

  LambdaExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub '${ProjectName}-${EnvironmentName}-lambda-role'
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service:
                - lambda.amazonaws.com
            Action:
              - sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
      Policies:
        - PolicyName: DynamoDbAccessPolicy
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - dynamodb:GetItem
                  - dynamodb:PutItem
                  - dynamodb:UpdateItem
                  - dynamodb:Query
                  - dynamodb:Scan
                Resource:
                  - !GetAtt MeetingsTable.Arn
                  - !Sub '${MeetingsTable.Arn}/index/StatusIndex'
        - PolicyName: LexRuntimePolicy
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - lex:RecognizeText
                  - lex:RecognizeUtterance
                Resource: '*'

  GetMeetingsFunction:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: !Sub '${ProjectName}-${EnvironmentName}-get-meetings'
      Runtime: python3.12
      Handler: app.lambda_handler
      Role: !GetAtt LambdaExecutionRole.Arn
      Timeout: 30
      Code:
        S3Bucket: !Ref LambdaArtifactBucket
        S3Key: get-meetings.zip
      Environment:
        Variables:
          TABLE_NAME: !Ref MeetingsTable

  GetPendingMeetingsFunction:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: !Sub '${ProjectName}-${EnvironmentName}-get-pending-meetings'
      Runtime: python3.12
      Handler: app.lambda_handler
      Role: !GetAtt LambdaExecutionRole.Arn
      Timeout: 30
      Code:
        S3Bucket: !Ref LambdaArtifactBucket
        S3Key: get-pending-meetings.zip
      Environment:
        Variables:
          TABLE_NAME: !Ref MeetingsTable

  UpdateMeetingStatusFunction:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: !Sub '${ProjectName}-${EnvironmentName}-update-meeting-status'
      Runtime: python3.12
      Handler: app.lambda_handler
      Role: !GetAtt LambdaExecutionRole.Arn
      Timeout: 30
      Code:
        S3Bucket: !Ref LambdaArtifactBucket
        S3Key: update-meeting-status.zip
      Environment:
        Variables:
          TABLE_NAME: !Ref MeetingsTable

  ChatbotApiFunction:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: !Sub '${ProjectName}-${EnvironmentName}-chatbot-api'
      Runtime: python3.12
      Handler: app.lambda_handler
      Role: !GetAtt LambdaExecutionRole.Arn
      Timeout: 30
      Code:
        S3Bucket: !Ref LambdaArtifactBucket
        S3Key: chatbot-api.zip
      Environment:
        Variables:
          LEX_BOT_ID: !Ref LexBotId
          LEX_BOT_ALIAS_ID: !Ref LexBotAliasId
          LEX_LOCALE_ID: 'en_US'
  LexFulfillmentFunction:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: !Sub '${ProjectName}-${EnvironmentName}-lex-fulfillment'
      Runtime: python3.12
      Handler: app.lambda_handler
      Role: !GetAtt LambdaExecutionRole.Arn
      Timeout: 30
      Code:
        S3Bucket: !Ref LambdaArtifactBucket
        S3Key: lex-fulfillment.zip
      Environment:
        Variables:
          TABLE_NAME: !Ref MeetingsTable

  LexFulfillmentPermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref LexFulfillmentFunction
      Action: lambda:InvokeFunction
      Principal: lexv2.amazonaws.com

  GetMeetingsPermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref GetMeetingsFunction
      Action: lambda:InvokeFunction
      Principal: apigateway.amazonaws.com

  GetPendingMeetingsPermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref GetPendingMeetingsFunction
      Action: lambda:InvokeFunction
      Principal: apigateway.amazonaws.com

  UpdateMeetingStatusPermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref UpdateMeetingStatusFunction
      Action: lambda:InvokeFunction
      Principal: apigateway.amazonaws.com

  ChatbotApiPermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref ChatbotApiFunction
      Action: lambda:InvokeFunction
      Principal: apigateway.amazonaws.com

  GetMeetingsIntegration:
    Type: AWS::ApiGatewayV2::Integration
    Properties:
      ApiId: !Ref HttpApi
      IntegrationType: AWS_PROXY
      IntegrationUri: !Sub 'arn:aws:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${GetMeetingsFunction.Arn}/invocations'
      PayloadFormatVersion: '2.0'

  GetPendingMeetingsIntegration:
    Type: AWS::ApiGatewayV2::Integration
    Properties:
      ApiId: !Ref HttpApi
      IntegrationType: AWS_PROXY
      IntegrationUri: !Sub 'arn:aws:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${GetPendingMeetingsFunction.Arn}/invocations'
      PayloadFormatVersion: '2.0'

  UpdateMeetingStatusIntegration:
    Type: AWS::ApiGatewayV2::Integration
    Properties:
      ApiId: !Ref HttpApi
      IntegrationType: AWS_PROXY
      IntegrationUri: !Sub 'arn:aws:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${UpdateMeetingStatusFunction.Arn}/invocations'
      PayloadFormatVersion: '2.0'

  ChatbotApiIntegration:
    Type: AWS::ApiGatewayV2::Integration
    Properties:
      ApiId: !Ref HttpApi
      IntegrationType: AWS_PROXY
      IntegrationUri: !Sub 'arn:aws:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${ChatbotApiFunction.Arn}/invocations'
      PayloadFormatVersion: '2.0'

  GetMeetingsRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref HttpApi
      RouteKey: 'GET /meetings'
      Target: !Sub 'integrations/${GetMeetingsIntegration}'
      AuthorizationType: JWT
      AuthorizerId: !Ref JwtAuthorizer

  GetPendingMeetingsRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref HttpApi
      RouteKey: 'GET /meetings/pending'
      Target: !Sub 'integrations/${GetPendingMeetingsIntegration}'
      AuthorizationType: JWT
      AuthorizerId: !Ref JwtAuthorizer

  UpdateMeetingStatusRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref HttpApi
      RouteKey: 'PUT /meetings/status'
      Target: !Sub 'integrations/${UpdateMeetingStatusIntegration}'
      AuthorizationType: JWT
      AuthorizerId: !Ref JwtAuthorizer

  ChatbotApiRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref HttpApi
      RouteKey: 'POST /chatbot'
      Target: !Sub 'integrations/${ChatbotApiIntegration}'
      AuthorizationType: NONE

Outputs:
  Region:
    Description: AWS region
    Value: !Ref AWS::Region

  MeetingsTableName:
    Description: DynamoDB table name
    Value: !Ref MeetingsTable

  CognitoUserPoolId:
    Description: Cognito User Pool ID
    Value: !Ref CognitoUserPool

  CognitoUserPoolClientId:
    Description: Cognito App Client ID
    Value: !Ref CognitoUserPoolClient

  ApiUrl:
    Description: HTTP API base URL
    Value: !Sub 'https://${HttpApi}.execute-api.${AWS::Region}.amazonaws.com/${HttpApiStage}'

  HttpApiId:
    Description: HTTP API ID
    Value: !Ref HttpApi

  FrontendBucketName:
    Description: S3 bucket for frontend hosting
    Value: !Ref FrontendBucket

  CloudFrontDistributionDomainName:
    Description: CloudFront distribution domain name
    Value: !GetAtt FrontendDistribution.DomainName
